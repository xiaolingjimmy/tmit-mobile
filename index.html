	<script>
		// 注册 Service Worker，让「添加到主屏幕」后可离线游玩（PWA）。
		// 失败（如旧浏览器/非安全上下文）静默忽略，不影响游戏。
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('./sw.js').catch(function () {});
			});
		}
	</script>

<body onload="load();" onmousemove="updateMouse(event)" ontouchstart="updateMouseTouch(event)" ontouchmove="updateMouseTouch(event)">
	<div id="loading">
		<div id="loading_bg">
			<div class="loader">
				*Loading...*
			</div>
		</div>
	</div>
	<div id="app">
		<div v-if="Modal.showing" style="height: 100%; width: 100%;
		position: absolute; z-index: 30001; top: 0; left: 0;
		background: #1119"></div>
		<modal></modal>
		<!-- 注意：这里刻意不在静态 HTML 上写死 id，改由 Vue 挂载时绑定。
		     原因：loader.js 以动态 script 方式注入 layers.js/tree.js，layers 对象可能在
		     游戏 load() 完成前就被填充；而 canvas.js 的 window resize 监听器会在 load()
		     之前触发 resizeCanvas() → drawTree()，此时 tmp 仍为空对象 {}，
		     drawTree 读 tmp[layer].layerShown 会抛 TypeError 并中断重绘。
		     挂载前 DOM 里没有 #treeCanvas，retrieveCanvasData() 直接返回 false，
		     从根上消除这个竞态；挂载后 id 照常存在（挂载发生在 setupTemp() 之后），功能不变。 -->
		<canvas v-bind:id="'treeCanvas'" class="canvas" v-if="!(tmp.gameEnded && !player.keepGoing)"></canvas>
		<div class="vl" v-if="player.navTab !== 'none' && !(tmp.gameEnded && !player.keepGoing)"></div>
		<div v-if="(tmp.gameEnded && !player.keepGoing)" class="fullWidth">
			<br>
			<h2>{{modInfo.name}} {{VERSION.withoutName}}</h2><br><br>
			<h3>抵达残局</h3><br><br>
			<div v-if="!player.timePlayedReset">恭喜你已经浪费了 {{formatTime(player.timePlayed*1000)}} 去玩这个游戏</div>
			<br><button class="longUpg can" onclick="keepGoing()">继续</button>
		</div>
		<div id="version" onclick="showTab('changelog-tab');getActiveClass('Changelog')" class="overlayThing"
			style="margin-right: 4px">
			{{VERSION.withoutName}}</div>

		<div id="treeOverlay" v-if="!(tmp.gameEnded && !player.keepGoing)" class="treeOverlay" onscroll="resizeCanvas()"
			v-bind:class="{ 
			fullWidth: player.navTab == 'none', 
			col: player.navTab !== 'none', 
			left: player.navTab !== 'none'}"
			:style="{'margin-top': !readData(layoutInfo.showTree) && player.tab == 'info-tab' ? '50px' : ''}">
			<overlay-head v-if="!(tmp.gameEnded && !player.keepGoing)"></overlay-head>
			<div class="sideLayers">
				<div v-for="(node, index) in OTHER_LAYERS['side']">
					<tree-node :layer='node' :abb='tmp[node].symbol' :size="'small'" :key="'side' + index"></tree-node>
				</div>
			</div>
		</div>

		<div v-if="!(tmp.gameEnded && !player.keepGoing)" id="treeTab" onscroll="resizeCanvas()"
			v-bind:class="{ fullWidth:player.navTab == 'none', col: player.navTab !== 'none', left: player.navTab !== 'none'}"
			style="overflow-x: hidden;">
			<overlay-head id="fakeHead" style="visibility: hidden;">
			</overlay-head>
			<layer-tab :layer="player.navTab == 'none' ? player.tab : player.navTab" :key="'left'"></layer-tab>
			<bg :layer="player.navTab == 'none' ? player.tab : player.navTab"></bg>
		</div>

		<!-- Popups -->
		<div class="popup-container">
			<transition-group name="fade">
				<div v-for="popup,index in activePopups" class="popup" v-bind:class="[popup.type, {'smallPopup': popup.small}]"
					v-bind:key="'p' + popup.id" v-on:click="() => {activePopups.splice(index, 1)}"
					v-bind:style="[popup.color ? { background: popup.color } : {}, popup.textcolor ? { color: popup.textcolor } : {}]">
					<h3>{{popup.title}}</h3><br>
					<h2 v-html="popup.message"></h2>
				</div>
			</transition-group>
		</div>
		<div class="particle-container">
			<div v-for="particle,index in particles">
				<particle :data="particle" :index="index" v-bind:key="'b' + particle.id"></particle>
			</div>
		</div>

		<div v-if="player.navTab !== 'none' && player.tab !== 'none' && !(tmp.gameEnded && !player.keepGoing)"
			onscroll="resizeCanvas()"
			v-bind:class="{ fullWidth: player.navTab == 'none' || !readData(layoutInfo.showTree), col2: player.navTab != 'none', right: player.navTab != 'none', fast: true, tab: true}">
			<div v-for="layer in LAYERS">
				<div v-if="player.tab==layer">
					<layer-tab :layer="layer" :back="'none'" :spacing="'50px'" :key="'left'"></layer-tab>
				</div>
			</div>
			<bg :layer="player.tab"></bg>
		</div>
		<div class="bg2" v-bind:style="tmp.backgroundStyle"></div>
	</div>
<style>
#cloud-fab{position:fixed;right:12px;top:12px;width:44px;height:44px;border-radius:50%;
  background:#1f2a38;border:1px solid #3a4a5a;color:#cdd7e0;display:flex;align-items:center;
  justify-content:center;cursor:pointer;z-index:29990;box-shadow:0 2px 10px rgba(0,0,0,.5);
  user-select:none;-webkit-user-select:none}
#cloud-fab:hover{background:#273545}
#cloud-fab .badge{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#52c552;display:none}
#cloud-panel{position:fixed;right:12px;top:64px;width:290px;max-height:78vh;overflow:auto;
  background:#16191e;border:1px solid #333a44;border-radius:12px;padding:16px;color:#dfe5ea;
  font-size:13px;z-index:29991;display:none;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#cloud-panel.show{display:block}
#cloud-panel .t{font-size:15px;font-weight:600;margin-bottom:10px;color:#fff}
#cloud-panel .hint{font-size:12px;color:#8a97a3;margin:6px 0}
#cloud-panel input{width:100%;box-sizing:border-box;margin:5px 0;padding:9px 10px;border-radius:8px;
  border:1px solid #3a424d;background:#0f1216;color:#e6ebf0;font-size:13px}
#cloud-panel input:focus{outline:none;border-color:#378ADD}
#cloud-panel .row{display:flex;gap:8px;margin-top:8px}
#cloud-panel button{flex:1;padding:9px 8px;border:0;border-radius:8px;font-size:13px;cursor:pointer;
  background:#378ADD;color:#fff}
#cloud-panel button.sec{background:#242b34;color:#cdd7e0}
#cloud-panel button:disabled{opacity:.5;cursor:not-allowed}
#cloud-panel .divider{height:1px;background:#2a323c;margin:12px 0}
#cloud-panel .st{font-size:12px;margin-top:10px;padding:8px;border-radius:8px;background:#12213a;color:#8ab4e8;word-break:break-all;display:none}
#cloud-panel .st.err{background:#3a1212;color:#e88a8a}
</style>

<div id="cloud-fab" title="云存档">
  <svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
  <div class="badge" id="cloud-badge"></div>
</div>

<div id="cloud-panel">
  <div id="cloud-view-login">
    <div class="t">云存档</div>
    <div class="hint">登录后可在多设备间同步存档</div>
    <input id="cloud-email" type="email" placeholder="邮箱">
    <input id="cloud-password" type="password" placeholder="密码">
    <div class="row"><button id="cloud-btn-login">登录</button><button id="cloud-btn-signup" class="sec">注册</button></div>
    <div class="st" id="cloud-st1"></div>
  </div>
  <div id="cloud-view-main" style="display:none">
    <div class="t">云存档</div>
    <div class="hint" id="cloud-user"></div>
    <div class="row">
      <button id="cloud-btn-upload">上传到云端</button>
      <button id="cloud-btn-download" class="sec">从云端恢复</button>
    </div>
    <div class="row"><button id="cloud-btn-logout" class="sec">退出登录</button></div>
    <div class="st" id="cloud-st2"></div>
  </div>
</div>

<script>
(function(){
  var fab = document.getElementById('cloud-fab');
  var panel = document.getElementById('cloud-panel');
  var badge = document.getElementById('cloud-badge');
  fab.addEventListener('click', function(){ panel.classList.toggle('show'); });

  function st(id, text, isErr){
    var el = document.getElementById(id);
    el.style.display = 'block';
    el.textContent = text;
    el.className = 'st' + (isErr ? ' err' : '');
  }

  document.getElementById('cloud-btn-login').onclick = function(){
    var email = document.getElementById('cloud-email').value;
    var pwd = document.getElementById('cloud-password').value;
    if(!email||!pwd) return st('cloud-st1','请输入邮箱和密码', true);
    CloudSave.signIn(email, pwd).then(function(r){
      if(!r.ok) return st('cloud-st1', r.error, true);
      onSignedIn(r.user);
    });
  };
  document.getElementById('cloud-btn-signup').onclick = function(){
    var email = document.getElementById('cloud-email').value;
    var pwd = document.getElementById('cloud-password').value;
    if(!email||!pwd) return st('cloud-st1','请输入邮箱和密码', true);
    CloudSave.signUp(email, pwd).then(function(r){
      if(!r.ok) return st('cloud-st1', r.error, true);
      onSignedIn(r.user);
    });
  };
  document.getElementById('cloud-btn-logout').onclick = function(){
    CloudSave.signOut().then(function(){ onSignedOut(); });
  };

  document.getElementById('cloud-btn-upload').onclick = function(){
    st('cloud-st2','正在上传…');
    window.__cloudUploadNow().then(function(r){
      st('cloud-st2', r.ok ? '已上传到云端' : r.error, !r.ok);
    }).catch(function(e){ st('cloud-st2', '上传失败：'+e.message, true); });
  };
  document.getElementById('cloud-btn-download').onclick = function(){
    if(!confirm('确定用云端存档覆盖本地进度吗？')) return;
    st('cloud-st2','正在从云端恢复…');
    window.__cloudDownloadNow().then(function(r){
      st('cloud-st2', r.ok ? '已从云端恢复，即将刷新' : r.error, !r.ok);
    }).catch(function(e){ st('cloud-st2', '下载失败：'+e.message, true); });
  };

  function onSignedIn(user){
    var email = (user && user.email) || '';
    document.getElementById('cloud-user').textContent = '已登录：' + email;
    document.getElementById('cloud-view-login').style.display = 'none';
    document.getElementById('cloud-view-main').style.display = 'block';
    badge.style.display = 'block';
    st('cloud-st2','已登录，可上传或恢复存档');
    if (window.__cloudAutoDownload) window.__cloudAutoDownload(true);
  }
  function onSignedOut(){
    document.getElementById('cloud-view-login').style.display = 'block';
    document.getElementById('cloud-view-main').style.display = 'none';
    badge.style.display = 'none';
  }

  CloudSave.isSignedIn().then(function(signed){
    if (signed) onSignedIn({});
    else onSignedOut();
  }).catch(function(){ onSignedOut(); });
})();
</script>
</body>
